# =====================================================================
# EntregaSegura · Docker Compose
#   proxy  -> único servicio con puerto publicado (red "edge")
#   api    -> red "edge" (para el proxy) + red "internal" (para la BD)
#   worker -> solo red "internal": sin puertos y sin salida a Internet
#   db     -> solo red "internal": el 5432 NO se publica
# Los valores ${...} salen del archivo .env (ver .env.example).
# =====================================================================
name: entregasegura

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }   # rotación: máx. 30 MB por servicio

x-hardened: &hardened
  read_only: true                               # sistema de archivos de solo lectura
  tmpfs: [/tmp]                                 # única zona escribible (en RAM)
  cap_drop: [ALL]                               # sin capabilities de Linux
  security_opt: ["no-new-privileges:true"]      # no puede escalar privilegios
  restart: unless-stopped                       # vuelve solo tras reinicio o fallo
  logging: *logging

services:
  proxy:
    <<: *hardened
    build: ./proxy
    image: entregasegura-proxy:local
    ports: ["${HTTP_PORT:-80}:8080"]
    networks: [edge]
    depends_on: { api: { condition: service_healthy } }
    deploy: { resources: { limits: { cpus: "0.25", memory: 64M, pids: 100 } } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  api:
    <<: *hardened
    build: ./api
    image: entregasegura-api:local
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      DB_USER: app_api                          # rol de mínimo privilegio, NO postgres
      DB_PASSWORD: ${APP_API_DB_PASSWORD:?Falta APP_API_DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD en .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [edge, internal]
    volumes: [files:/data]
    depends_on: { db: { condition: service_healthy } }
    deploy: { resources: { limits: { cpus: "0.50", memory: 256M, pids: 100 } } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *hardened
    build: ./worker
    image: entregasegura-worker:local
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      DB_USER: app_worker                       # otro rol, con aún menos permisos
      DB_PASSWORD: ${APP_WORKER_DB_PASSWORD:?Falta APP_WORKER_DB_PASSWORD en .env}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      RECUPERAR_TRAS_SEG: ${RECUPERAR_TRAS_SEG:-300}
      WORKER_DEMORA_MS: ${WORKER_DEMORA_MS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [internal]
    volumes: [files:/data]
    depends_on: { db: { condition: service_healthy } }
    # ↓↓↓ Reto 4 (recursos): cambiar aquí y ejecutar  docker compose up -d worker
    deploy: { resources: { limits: { cpus: "0.50", memory: 256M, pids: 100 } } }
    healthcheck:
      # el worker escribe /tmp/heartbeat cada 10 s si llega a la BD
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/heartbeat -mmin -1 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    # Registra en el log todo cambio de estructura (DROP TRIGGER, ALTER TABLE...):
    # si alguien desactiva la protección de audit_log, queda constancia.
    command: ["postgres", "-c", "log_statement=ddl"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      APP_API_DB_PASSWORD: ${APP_API_DB_PASSWORD:?Falta APP_API_DB_PASSWORD en .env}
      APP_WORKER_DB_PASSWORD: ${APP_WORKER_DB_PASSWORD:?Falta APP_WORKER_DB_PASSWORD en .env}
    networks: [internal]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    # PostgreSQL arranca como root solo para ajustar permisos y luego baja a
    # su usuario "postgres"; se le dejan únicamente las capabilities para eso.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    deploy: { resources: { limits: { cpus: "0.50", memory: 384M, pids: 100 } } }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *logging

networks:
  edge: {}
  internal: { internal: true }   # sin salida a Internet: worker y BD aislados

volumes:
  pgdata: {}   # datos de PostgreSQL
  files: {}    # /data/originales y /data/resultados
