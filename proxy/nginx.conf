# =====================================================================
# EntregaSegura · Nginx: frontend estático + proxy inverso hacia /api
# Es el ÚNICO contenedor con un puerto publicado.
# =====================================================================
server_tokens off;   # no revelar la versión de Nginx

server {
    listen 8080;
    server_name _;

    # Capa 1 de validación de archivos: nada de más de 5 MB llega a la API.
    client_max_body_size 5m;
    client_body_timeout 30s;

    # Cabeceras de seguridad para todo lo que sirve
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    # DNS interno de Docker: si el contenedor api se recrea (cambia de IP),
    # Nginx lo vuelve a encontrar sin reiniciarse.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Se SOBRESCRIBE (no se añade): el cliente no puede falsificar su IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # la subida va directa a la API
        proxy_read_timeout 60s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
