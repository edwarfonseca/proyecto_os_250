# =====================================================================
# EntregaSegura · Nginx: frontend estático + proxy inverso hacia /api
# Es el ÚNICO contenedor con un puerto publicado.
# Esta es la configuración por defecto (local, solo HTTP). En la EC2 se
# sustituye por nginx-https.conf (ver docker-compose.https.yml).
# =====================================================================
server_tokens off;   # no revelar la versión de Nginx

server {
    listen 8080;
    server_name _;
    include /etc/nginx/entregasegura/comun.conf;
}
