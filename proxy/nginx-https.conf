# =====================================================================
# EntregaSegura · Nginx con HTTPS (solo en la EC2).
# La monta docker-compose.https.yml encima de nginx.conf. El certificado
# es de Let's Encrypt: lo obtiene y renueva infra/configurar_https.sh y
# lo deja en /etc/entregasegura/tls del host (montado en /etc/nginx/tls).
# =====================================================================
server_tokens off;   # no revelar la versión de Nginx

# 1) HTTP público: todo se redirige a HTTPS (301 = permanente).
server {
    listen 8080 default_server;
    server_name _;

    # El healthcheck del contenedor entra por aquí con Host 127.0.0.1.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 301 https://entregasegura-uptc.duckdns.org$request_uri;
    }
}

# 2) HTTP interno: solo para quien llama como "localhost" desde la propia
#    EC2 (deploy.sh y los scripts de prueba). Desde fuera no sirve de nada:
#    la cookie de sesión lleva la marca Secure y el navegador no la envía
#    por HTTP a un sitio que no sea localhost.
server {
    listen 8080;
    server_name localhost 127.0.0.1;
    include /etc/nginx/entregasegura/comun.conf;
}

# 3) HTTPS: el sitio real.
server {
    listen 8443 ssl;
    http2 on;
    server_name entregasegura-uptc.duckdns.org;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;          # nada de SSLv3, TLS 1.0 ni 1.1
    ssl_prefer_server_ciphers off;          # el cliente elige entre cifrados modernos
    ssl_session_cache shared:TLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: el navegador recordará usar solo HTTPS con este nombre.
    # 1 día a propósito mientras se estrena (hstspreload.org recomienda
    # subirlo por etapas); si hubiera que volver a HTTP, el bloqueo dura poco.
    add_header Strict-Transport-Security "max-age=86400" always;

    include /etc/nginx/entregasegura/comun.conf;
}
